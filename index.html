<title>Operation Chronos</title>
<style>
:root { --parch: #f6efdd; --note: #fffaf0; --navy: #0e2440; --gold: #a97c1e; --red: #9c2a20; --muted: #5d5546; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at top, #3a2a18, #120b05 70%); font-family: Georgia, "Times New Roman", serif; color: var(--navy); padding: 16px; box-sizing: border-box; }
main { background: var(--note); border: 3px solid var(--gold); border-radius: 14px; padding: 32px 36px; max-width: 640px; width: 100%; box-shadow: 0 16px 40px rgba(0, 0, 0, .5); box-sizing: border-box; }
small { display: block; letter-spacing: .18em; text-transform: uppercase; color: var(--red); font-weight: 700; font-size: 13px; }
h1 { margin: 6px 0 20px; font-size: clamp(28px, 6vw, 42px); }
a { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-decoration: none; color: var(--navy); border: 2px solid var(--gold); border-radius: 10px; padding: 14px 18px; margin: 10px 0; background: var(--parch); font-size: 19px; }
a:hover { background: #fff; }
a span { color: var(--muted); font-size: 14px; }
p { color: var(--muted); font-size: 14px; margin: 18px 0 0; }
</style>
</head>
